services:
  # 1. Laravel Web Application (PHP-FPM 8.3)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartexam_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=smartexam
      - DB_USERNAME=smartexam
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
    volumes:
      - .:/var/www
      - /var/www/vendor
      - ./storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartexam_network

  # 2. Nginx Web Server
  webserver:
    image: nginx:alpine
    container_name: smartexam_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - smartexam_network

  # 3. MySQL Database Server (v8.0)
  db:
    image: mysql:8.0
    container_name: smartexam_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smartexam
      MYSQL_USER: smartexam
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - smartexam_dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - smartexam_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 4. Queue Worker (AI Auto-Grading & Async Jobs)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartexam_queue
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=smartexam
      - DB_USERNAME=smartexam
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    volumes:
      - .:/var/www
      - /var/www/vendor
      - ./storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - smartexam_network

networks:
  smartexam_network:
    driver: bridge

volumes:
  smartexam_dbdata:
    driver: local
